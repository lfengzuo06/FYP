# Dataset Configuration - 3-Compartment Non-Gaussian (Pathway Regression)
# Generated by dexsy_datasets

version: "1.0"
protocol_version: "1"
generator_version: "1.0.0"

# Task type: reconstruction (signal->spectrum) or pathway_regression (signal->pathway_weights/dei)
task_type: "pathway_regression"

# Data split sizes
n_train: 9500
n_val: 400
n_test: 400

# Grid size (16 or 64)
n_b: 16

# Forward model type
model_type: "nongaussian_3c"

# Physical parameters
params:
  # Extracellular (Gaussian) compartment
  extracellular_diffusivity_range: [1.0e-9, 2.5e-9]

  # Intracellular diffusion coefficient (shared by T and S compartments)
  intracellular_diffusivity_range: [0.4e-9, 1.2e-9]

  # Axon/ellipsoid restricted compartment
  axon_restricted_length_range: [0.5e-6, 2.0e-6]

  # Sphere/glial cell restricted compartment
  sphere_radius_range: [1.0e-6, 6.0e-6]

  # Mixing time range
  mixing_time_range: [0.015, 0.300]

  # Compartment fraction ranges (must sum to ~1 for each sample)
  extracellular_fraction_range: [0.3, 0.7]
  axon_fraction_range: [0.1, 0.4]
  sphere_fraction_range: [0.1, 0.4]

  # Noise sigma: null = noise-free, or [min, max] for random noise
  noise_sigma: null

# Sampling strategy
sampling_strategy: "log_uniform"
min_index_separation: 0

# Random seed for data generation (reproducibility)
seed: 42
