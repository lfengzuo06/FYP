# Dataset Configuration - 2-Compartment Gaussian (Reconstruction)
# Generated by dexsy_datasets

version: "1.0"
protocol_version: "1"
generator_version: "1.0.0"

# Task type: reconstruction (signal->spectrum) or pathway_regression (signal->pathway_weights/dei)
task_type: "reconstruction"

# Data split sizes
n_train: 9500
n_val: 400
n_test: 400

# Grid size (16 or 64)
n_b: 16

# Forward model type
model_type: "gaussian_2c"

# Physical parameters (from GRID_PROFILES)
params:
  d_min: 1e-11
  d_max: 1e-8
  g_max: 1.5
  delta: 0.003
  DELTA: 0.01
  jitter_pixels: 0
  smoothing_sigma_range: [0.4, 0.8]
  min_index_separation: 2
  noise_sigma_range: [0.005, 0.015]

# Sampling strategy
sampling_strategy: "log_uniform"

# Random seed for data generation (reproducibility)
seed: 42
